services:
  db:
    image: postgres:16-alpine
    container_name: glicovoz_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glicovoz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-glicovoz_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-glicovoz} -d $${POSTGRES_DB:-glicovoz_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: glicovoz_app
    restart: always
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-glicovoz}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-glicovoz_db}
      - OLLAMA_HOST=${OLLAMA_HOST_DOCKER:-http://host.docker.internal:11434}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
